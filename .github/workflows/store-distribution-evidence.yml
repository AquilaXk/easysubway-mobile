name: Store Credential Preflight

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    name: Store Credential Preflight
    runs-on: ubuntu-latest
    environment:
      name: store-release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate tracked metadata without credentials or writes
        run: |
          jq -e '.schemaVersion == 1 and .androidApplicationId == "com.easysubway.app"' \
            apps/mobile/release/store-submission-readiness.json
          jq -e '.schemaVersion == 1 and .androidApplicationId == "com.easysubway.app"' \
            apps/mobile/release/play-store-submission-content.json
          jq -e '.schemaVersion == 1 and .applicationId == "easysubway"' \
            apps/mobile/release/store-privacy-inventory.json
      - name: Validate upload signing credentials
        shell: bash
        env:
          EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          EASYSUBWAY_ANDROID_STORE_PASSWORD: ${{ secrets.EASYSUBWAY_ANDROID_STORE_PASSWORD }}
          EASYSUBWAY_ANDROID_KEY_ALIAS: ${{ secrets.EASYSUBWAY_ANDROID_KEY_ALIAS }}
          EASYSUBWAY_ANDROID_KEY_PASSWORD: ${{ secrets.EASYSUBWAY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in \
            EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64 \
            EASYSUBWAY_ANDROID_STORE_PASSWORD \
            EASYSUBWAY_ANDROID_KEY_ALIAS \
            EASYSUBWAY_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              printf '%s is required.\n' "${name}" >&2
              exit 1
            fi
          done
          keystore="${RUNNER_TEMP}/upload-keystore"
          signing_check="${RUNNER_TEMP}/signing-check.p12"
          export EASYSUBWAY_EPHEMERAL_KEYSTORE_PASSWORD
          EASYSUBWAY_EPHEMERAL_KEYSTORE_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          printf '%s' "${EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          keytool -list \
            -keystore "${keystore}" \
            -storepass:env EASYSUBWAY_ANDROID_STORE_PASSWORD \
            -alias "${EASYSUBWAY_ANDROID_KEY_ALIAS}"
          keytool -importkeystore \
            -srckeystore "${keystore}" \
            -srcstorepass:env EASYSUBWAY_ANDROID_STORE_PASSWORD \
            -srcalias "${EASYSUBWAY_ANDROID_KEY_ALIAS}" \
            -srckeypass:env EASYSUBWAY_ANDROID_KEY_PASSWORD \
            -destkeystore "${signing_check}" \
            -deststoretype PKCS12 \
            -deststorepass:env EASYSUBWAY_EPHEMERAL_KEYSTORE_PASSWORD \
            -destkeypass:env EASYSUBWAY_EPHEMERAL_KEYSTORE_PASSWORD \
            -noprompt
          rm -f "${keystore}" "${signing_check}"
      - name: Validate temporary Google Play edit access
        id: play
        shell: bash
        env:
          EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64}" ]]; then
            printf 'EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 is required.\n' >&2
            exit 1
          fi
          package_name="$(jq -er '.androidApplicationId' apps/mobile/release/store-submission-readiness.json)"
          version_code="$(sed -n 's/^version: [^+]*+//p' apps/mobile/pubspec.yaml)"
          if [[ ! "${version_code}" =~ ^[0-9]+$ ]]; then
            printf 'mobile versionCode must be a positive integer.\n' >&2
            exit 1
          fi
          service_account_base64="${EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64//[[:space:]]/}"
          env_file="${RUNNER_TEMP}/google-play-preflight.env"
          {
            printf 'EASYSUBWAY_GOOGLE_PLAY_PACKAGE_NAME=%s\n' "${package_name}"
            printf 'EASYSUBWAY_GOOGLE_PLAY_LATEST_VERSION_CODE=%s\n' "${version_code}"
            printf 'EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64=%s\n' \
              "${service_account_base64}"
          } > "${env_file}"
          play_status=0
          node tools/ci/check-google-play-api-access.mjs \
            --env-file "${env_file}" \
            --github-output "${GITHUB_OUTPUT}" \
            --report "${RUNNER_TEMP}/google-play-api-access.txt" || play_status=$?
          cat "${RUNNER_TEMP}/google-play-api-access.txt"
          exit "${play_status}"
      - name: Require Google Play readiness
        env:
          GOOGLE_PLAY_API_ACCESS_READY: ${{ steps.play.outputs.google_play_api_access_ready }}
        run: test "${GOOGLE_PLAY_API_ACCESS_READY}" = true
