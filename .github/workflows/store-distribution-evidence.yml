name: Store Credential Preflight

on:
  workflow_dispatch:

permissions: {}

# Android Publisher는 "Each user may have only a single edit open at a time"이고
# "If you create a new edit, any existing edit you may have open is invalidated"이다
# (https://developers.google.com/android-publisher/edits). 같은 service account를 쓰는
# 실행이 겹치면 preflight의 edits.insert가 상대의 열린 edit을 무효화할 수 있으므로,
# Play 자격증명을 소비하는 실행은 이 group으로 직렬화한다. 앞으로 추가되는 Play
# 게시 워크플로도 같은 group에 합류해야 한다.
# cancel-in-progress를 false로 두는 이유: 진행 중 실행을 취소하면 edit 삭제 단계가
# 건너뛰어져 열린 edit이 그대로 남는다.
concurrency:
  group: store-release-google-play-edit
  cancel-in-progress: false

jobs:
  preflight:
    name: Store Credential Preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: store-release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate tracked metadata without credentials or writes
        run: |
          jq -e '.schemaVersion == 1 and .androidApplicationId == "com.easysubway.app"' \
            apps/mobile/release/store-submission-readiness.json
          jq -e '.schemaVersion == 1 and .androidApplicationId == "com.easysubway.app"' \
            apps/mobile/release/play-store-submission-content.json
          jq -e '.schemaVersion == 1 and .applicationId == "easysubway"' \
            apps/mobile/release/store-privacy-inventory.json
      - name: Validate upload signing credentials
        shell: bash
        env:
          EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          EASYSUBWAY_ANDROID_STORE_PASSWORD: ${{ secrets.EASYSUBWAY_ANDROID_STORE_PASSWORD }}
          EASYSUBWAY_ANDROID_KEY_ALIAS: ${{ secrets.EASYSUBWAY_ANDROID_KEY_ALIAS }}
          EASYSUBWAY_ANDROID_KEY_PASSWORD: ${{ secrets.EASYSUBWAY_ANDROID_KEY_PASSWORD }}
          EASYSUBWAY_ANDROID_UPLOAD_CERT_SHA256: ${{ vars.EASYSUBWAY_ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          trim_signing_value() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            printf '%s' "${value%"${value##*[![:space:]]}"}"
          }
          EASYSUBWAY_ANDROID_STORE_PASSWORD="$(trim_signing_value "${EASYSUBWAY_ANDROID_STORE_PASSWORD}")"
          EASYSUBWAY_ANDROID_KEY_ALIAS="$(trim_signing_value "${EASYSUBWAY_ANDROID_KEY_ALIAS}")"
          EASYSUBWAY_ANDROID_KEY_PASSWORD="$(trim_signing_value "${EASYSUBWAY_ANDROID_KEY_PASSWORD}")"
          for name in \
            EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64 \
            EASYSUBWAY_ANDROID_STORE_PASSWORD \
            EASYSUBWAY_ANDROID_KEY_ALIAS \
            EASYSUBWAY_ANDROID_KEY_PASSWORD \
            EASYSUBWAY_ANDROID_UPLOAD_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              printf '%s is required.\n' "${name}" >&2
              exit 1
            fi
          done
          keystore="${RUNNER_TEMP}/upload-keystore"
          signing_check="${RUNNER_TEMP}/signing-check.p12"
          key_info="${RUNNER_TEMP}/upload-key-info.txt"
          certificate="${RUNNER_TEMP}/upload-cert.der"
          trap 'rm -f "${keystore}" "${signing_check}" "${key_info}" "${certificate}"' EXIT
          export EASYSUBWAY_EPHEMERAL_KEYSTORE_PASSWORD
          EASYSUBWAY_EPHEMERAL_KEYSTORE_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          printf '%s' "${EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore "${keystore}" \
            -storepass:env EASYSUBWAY_ANDROID_STORE_PASSWORD \
            -alias "${EASYSUBWAY_ANDROID_KEY_ALIAS}" > "${key_info}"
          grep -Fxq 'Entry type: PrivateKeyEntry' "${key_info}"
          keytool -exportcert \
            -keystore "${keystore}" \
            -storepass:env EASYSUBWAY_ANDROID_STORE_PASSWORD \
            -alias "${EASYSUBWAY_ANDROID_KEY_ALIAS}" \
            -file "${certificate}" > /dev/null
          fingerprint="$(node -e 'const { X509Certificate } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(new X509Certificate(readFileSync(process.argv[1])).fingerprint256.replaceAll(":", ""));' "${certificate}")"
          expected_fingerprint="${EASYSUBWAY_ANDROID_UPLOAD_CERT_SHA256//[[:space:]:]/}"
          expected_fingerprint="${expected_fingerprint^^}"
          if [[ ! "${expected_fingerprint}" =~ ^[A-F0-9]{64}$ || "${fingerprint}" != "${expected_fingerprint}" ]]; then
            printf 'upload certificate SHA-256 fingerprint mismatch.\n' >&2
            exit 1
          fi
          keytool -importkeystore \
            -srckeystore "${keystore}" \
            -srcstorepass:env EASYSUBWAY_ANDROID_STORE_PASSWORD \
            -srcalias "${EASYSUBWAY_ANDROID_KEY_ALIAS}" \
            -srckeypass:env EASYSUBWAY_ANDROID_KEY_PASSWORD \
            -destkeystore "${signing_check}" \
            -deststoretype PKCS12 \
            -deststorepass:env EASYSUBWAY_EPHEMERAL_KEYSTORE_PASSWORD \
            -destkeypass:env EASYSUBWAY_EPHEMERAL_KEYSTORE_PASSWORD \
            -noprompt
      # 임시 edit 1개를 만들어 track 조회·validate 후 반드시 삭제한다.
      # AAB upload, edit commit, track mutation, publish는 수행하지 않는다.
      - name: Validate no-upload Google Play edit lifecycle
        id: play
        shell: bash
        env:
          EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64}" ]]; then
            printf 'EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 is required.\n' >&2
            exit 1
          fi
          package_name="$(jq -er '.androidApplicationId' apps/mobile/release/store-submission-readiness.json)"
          version_code="$(sed -n 's/^version: [^+]*+//p' apps/mobile/pubspec.yaml)"
          if [[ ! "${version_code}" =~ ^[1-9][0-9]{0,9}$ ]] || (( version_code > 2100000000 )); then
            printf 'mobile versionCode must be between 1 and 2100000000.\n' >&2
            exit 1
          fi
          service_account_base64="${EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64//[[:space:]]/}"
          env_file="${RUNNER_TEMP}/google-play-preflight.env"
          {
            printf 'EASYSUBWAY_GOOGLE_PLAY_PACKAGE_NAME=%s\n' "${package_name}"
            printf 'EASYSUBWAY_GOOGLE_PLAY_LATEST_VERSION_CODE=%s\n' "${version_code}"
            printf 'EASYSUBWAY_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64=%s\n' \
              "${service_account_base64}"
          } > "${env_file}"
          play_status=0
          node tools/ci/check-google-play-api-access.mjs \
            --env-file "${env_file}" \
            --github-output "${GITHUB_OUTPUT}" \
            --report "${RUNNER_TEMP}/google-play-api-access.txt" || play_status=$?
          cat "${RUNNER_TEMP}/google-play-api-access.txt"
          exit "${play_status}"
      - name: Require Google Play readiness
        env:
          GOOGLE_PLAY_API_ACCESS_READY: ${{ steps.play.outputs.google_play_api_access_ready }}
        run: test "${GOOGLE_PLAY_API_ACCESS_READY}" = true
