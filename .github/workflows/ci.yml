name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Fetch exact generic mobile consumer bundle
        env:
          GH_TOKEN: ${{ secrets.HUB_ACTIONS_ARTIFACT_READ_TOKEN }}
          BUNDLE_INPUT_ROOT: ${{ runner.temp }}/generic-mobile-consumer-bundle-input-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          umask 077
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "HUB_ACTIONS_ARTIFACT_READ_TOKEN is required" >&2
            exit 1
          fi
          if [[ -e "$BUNDLE_INPUT_ROOT" || -L "$BUNDLE_INPUT_ROOT" ]]; then
            echo "generic mobile consumer bundle input path already exists" >&2
            exit 1
          fi
          mkdir "$BUNDLE_INPUT_ROOT"
          gh api --method GET --header "Accept: application/vnd.github+json" /repos/AquilaXk/easysubway/actions/runs/31280042807 > "$BUNDLE_INPUT_ROOT/run-metadata.json"
          gh api --method GET --header "Accept: application/vnd.github+json" /repos/AquilaXk/easysubway/actions/artifacts/9028141921 > "$BUNDLE_INPUT_ROOT/metadata.json"
          gh api --method GET --header "Accept: application/vnd.github+json" /repos/AquilaXk/easysubway/actions/artifacts/9028141921/zip > "$BUNDLE_INPUT_ROOT/artifact.zip"
      - name: Stage exact generic mobile consumer bundle
        env:
          BUNDLE_INPUT_ROOT: ${{ runner.temp }}/generic-mobile-consumer-bundle-input-${{ github.run_id }}-${{ github.run_attempt }}
          BUNDLE_STAGE_ROOT: ${{ runner.temp }}/generic-mobile-consumer-bundle-stage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node tools/mobile/stage-generic-mobile-consumer-bundle.mjs \
            --lock contracts/mobile/generic-mobile-consumer-bundle.lock.json \
            --metadata "$BUNDLE_INPUT_ROOT/metadata.json" \
            --workflow-run "$BUNDLE_INPUT_ROOT/run-metadata.json" \
            --archive "$BUNDLE_INPUT_ROOT/artifact.zip" \
            --fixture-root "$GITHUB_WORKSPACE" \
            --stage-root "$BUNDLE_STAGE_ROOT"
      - name: Verify residual consumer snapshots
        run: sha256sum --check contracts/mobile/consumer-snapshots.sha256
      - name: Run owned Node checks
        run: |
          node --test \
            tools/ci/check-google-play-api-access.test.mjs \
            tools/ci/filter-mobile-lcov.test.mjs \
            tools/ci/lib/google-play-auth.test.mjs \
            tools/mobile/automerge-queue.test.mjs \
            tools/mobile/check-android-aab-16kb-page-size.test.mjs \
            tools/mobile/datapack-contract.test.mjs \
            tools/mobile/stage-generic-mobile-consumer-bundle.test.mjs \
            tools/mobile/store-release-preflight.test.mjs \
            tools/mobile/status-voice-inventory.test.mjs \
            tools/release/hash-android-bundle-payload.test.mjs
          node tools/ci/audit-mobile-datapack-assets.mjs \
            --index apps/mobile/assets/datapacks/index.json \
            --root apps/mobile
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check format
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Discover host tests
        env:
          TEST_PARITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          TEST_PARITY_HEAD_SHA: ${{ github.sha }}
        run: |
          node tools/ci/mobile-host-test-parity.mjs discover \
            --repository . \
            --policy tools/ci/mobile-host-test-policy.json \
            --output "${RUNNER_TEMP}/mobile-host-test-inventory.json" \
            --base "${TEST_PARITY_BASE_SHA}" \
            --head "${TEST_PARITY_HEAD_SHA}" \
            --event "${GITHUB_EVENT_NAME}"
      - name: Test
        working-directory: apps/mobile
        run: >-
          flutter test --coverage
          --file-reporter "json:${RUNNER_TEMP}/mobile-host-test-events.json"
      - name: Verify host test execution parity
        run: |
          node tools/ci/mobile-host-test-parity.mjs verify \
            --inventory "${RUNNER_TEMP}/mobile-host-test-inventory.json" \
            --report "${RUNNER_TEMP}/mobile-host-test-events.json" \
            --summary "${RUNNER_TEMP}/mobile-host-test-parity.json"
      - name: Filter mobile coverage
        working-directory: apps/mobile
        run: |
          node ../../tools/ci/filter-mobile-lcov.mjs \
            --input coverage/lcov.info \
            --output coverage/lcov.info

  android:
    name: Android CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Create ephemeral preflight key
        env:
          EASYSUBWAY_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mobile-preflight.p12
          EASYSUBWAY_ANDROID_STORE_PASSWORD: mobile-preflight
          EASYSUBWAY_ANDROID_KEY_ALIAS: mobile-preflight
          EASYSUBWAY_ANDROID_KEY_PASSWORD: mobile-preflight
        run: |
          keytool -genkeypair -storetype PKCS12 \
            -keystore "${EASYSUBWAY_ANDROID_KEYSTORE_PATH}" \
            -storepass "${EASYSUBWAY_ANDROID_STORE_PASSWORD}" \
            -keypass "${EASYSUBWAY_ANDROID_KEY_PASSWORD}" \
            -alias "${EASYSUBWAY_ANDROID_KEY_ALIAS}" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=EasySubway Mobile CI"
      - name: Build no-upload release AAB
        working-directory: apps/mobile
        env:
          EASYSUBWAY_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mobile-preflight.p12
          EASYSUBWAY_ANDROID_STORE_PASSWORD: mobile-preflight
          EASYSUBWAY_ANDROID_KEY_ALIAS: mobile-preflight
          EASYSUBWAY_ANDROID_KEY_PASSWORD: mobile-preflight
        run: |
          defines=(
            --dart-define=EASYSUBWAY_API_BASE_URL=https://easysubway-api.aquilaxk.site
            --dart-define=EASYSUBWAY_KAKAO_MAP_NATIVE_APP_KEY=ci-preflight
          )
          ../../tools/mobile/validate-release-dart-defines.sh "${defines[@]}"
          flutter build appbundle --release "${defines[@]}"
          ../../tools/mobile/check-android-aab-16kb-page-size.sh \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --android-project android \
            --artifact-dir "$RUNNER_TEMP/android-16kb-aab-evidence"
          node ../../tools/release/hash-android-bundle-payload.mjs \
            --aab build/app/outputs/bundle/release/app-release.aab

  dependency-vulnerability-scan:
    name: Dependency Vulnerability Scan
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9fd1bcce27f67e3bd819a0a7620e332803dc43bc
    with:
      export-results: false
      upload-sarif: true
      fail-on-vuln: true
      scan-args: |-
        --lockfile=apps/mobile/pubspec.lock
        --lockfile=apps/mobile/android/app/gradle.lockfile
