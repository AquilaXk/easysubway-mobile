name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
      - name: Verify consumer snapshots
        run: sha256sum --check contracts/mobile/consumer-snapshots.sha256
      - name: Run owned Node checks
        run: |
          node --test \
            tools/ci/check-google-play-api-access.test.mjs \
            tools/ci/filter-mobile-lcov.test.mjs \
            tools/ci/lib/google-play-auth.test.mjs \
            tools/mobile/automerge-queue.test.mjs \
            tools/mobile/check-android-aab-16kb-page-size.test.mjs \
            tools/mobile/datapack-contract.test.mjs \
            tools/mobile/store-release-preflight.test.mjs \
            tools/mobile/status-voice-inventory.test.mjs \
            tools/release/hash-android-bundle-payload.test.mjs
          node tools/ci/audit-mobile-datapack-assets.mjs \
            --index apps/mobile/assets/datapacks/index.json \
            --root apps/mobile
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check format
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test
        working-directory: apps/mobile
        run: |
          flutter test --coverage
          node ../../tools/ci/filter-mobile-lcov.mjs \
            --input coverage/lcov.info \
            --output coverage/lcov.info

  android:
    name: Android CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Create ephemeral preflight key
        env:
          EASYSUBWAY_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mobile-preflight.p12
          EASYSUBWAY_ANDROID_STORE_PASSWORD: mobile-preflight
          EASYSUBWAY_ANDROID_KEY_ALIAS: mobile-preflight
          EASYSUBWAY_ANDROID_KEY_PASSWORD: mobile-preflight
        run: |
          keytool -genkeypair -storetype PKCS12 \
            -keystore "${EASYSUBWAY_ANDROID_KEYSTORE_PATH}" \
            -storepass "${EASYSUBWAY_ANDROID_STORE_PASSWORD}" \
            -keypass "${EASYSUBWAY_ANDROID_KEY_PASSWORD}" \
            -alias "${EASYSUBWAY_ANDROID_KEY_ALIAS}" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=EasySubway Mobile CI"
      - name: Build no-upload release AAB
        working-directory: apps/mobile
        env:
          EASYSUBWAY_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mobile-preflight.p12
          EASYSUBWAY_ANDROID_STORE_PASSWORD: mobile-preflight
          EASYSUBWAY_ANDROID_KEY_ALIAS: mobile-preflight
          EASYSUBWAY_ANDROID_KEY_PASSWORD: mobile-preflight
        run: |
          defines=(
            --dart-define=EASYSUBWAY_API_BASE_URL=https://easysubway-api.aquilaxk.site
            --dart-define=EASYSUBWAY_KAKAO_MAP_NATIVE_APP_KEY=ci-preflight
          )
          ../../tools/mobile/validate-release-dart-defines.sh "${defines[@]}"
          flutter build appbundle --release "${defines[@]}"
          bundletool_jar="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools.build/bundletool" -type f -name '*.jar' -print -quit)"
          if [[ -z "$bundletool_jar" ]]; then
            echo "Gradle-downloaded bundletool JAR not found after AAB build." >&2
            exit 1
          fi
          ../../tools/mobile/check-android-aab-16kb-page-size.sh \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --artifact-dir "$RUNNER_TEMP/android-16kb-aab-evidence" \
            --bundletool "$bundletool_jar"
          node ../../tools/release/hash-android-bundle-payload.mjs \
            --aab build/app/outputs/bundle/release/app-release.aab

  dependency-vulnerability-scan:
    name: Dependency Vulnerability Scan
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@3a7550f43ba5b58905a821ce3a0ed24c4858b3f4
    with:
      export-results: false
      upload-sarif: true
      fail-on-vuln: true
      scan-args: |-
        --lockfile=apps/mobile/pubspec.lock
        --lockfile=apps/mobile/android/app/gradle.lockfile
