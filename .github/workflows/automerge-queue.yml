name: Automerge Queue

on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: automerge-queue
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Coordinate oldest eligible pull request
        shell: bash
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          owner="${repo%%/*}"
          name="${repo#*/}"

          rules="$(gh api "repos/${repo}/rules/branches/main")"
          required="$(jq -c '
            [.[] |
              select(.type == "required_status_checks") |
              .parameters.required_status_checks[] |
              {context, integration_id: (.integration_id // null)}] |
            unique_by(.context, .integration_id)
          ' <<<"${rules}")"
          jq -e 'length > 0' <<<"${required}" >/dev/null

          candidates="$(gh pr list --repo "${repo}" --base main --state open --label automerge \
            --limit 1000 --json number,createdAt \
            --jq '[sort_by(.createdAt)[].number]')"

          # 큐는 strict FIFO가 아니라 best-effort FIFO다. 오래된 순으로 후보를 훑되 병합할 수
          # 없는 후보는 사유를 남기고 건너뛴다. head 하나만 처리하면 그 한 건이 막혔을 때 뒤의
          # PR이 전부 굶고, 굶주림을 막으려 타이머·derail을 넣으면 다시 오작동 표면이 생긴다.
          # 건너뛰기는 병합을 하지 않는 방향이라 게이트를 약화시키지 않으며, 각 후보는 리뷰·
          # 미해결 thread·required context 검증을 그대로 통과해야 한다. 실제 동작(병합 예약
          # 또는 base 갱신)은 한 실행에 최대 한 건이므로 병합 직렬화는 그대로 유지된다.
          # 후보를 20건으로 제한해 job timeout(5분) 안에서 끝나게 한다.
          # queue-loop-begin
          while IFS= read -r pr; do
            info="$(gh pr view "${pr}" --repo "${repo}" \
              --json baseRefName,headRefName,headRefOid,headRepository,isDraft,labels,mergeStateStatus,state)"
            if ! jq -e '
              .state == "OPEN" and
              .isDraft == false and
              .baseRefName == "main" and
              any(.labels[]; .name == "automerge")
            ' <<<"${info}" >/dev/null; then
              echo "PR #${pr}: no longer an open labeled pull request against main; skipping."
              continue
            fi

            head="$(jq -r '.headRefOid' <<<"${info}")"
            head_ref="$(jq -r '.headRefName' <<<"${info}")"
            head_repo="$(jq -r '.headRepository.nameWithOwner // ""' <<<"${info}")"
            merge_state="$(jq -r '.mergeStateStatus' <<<"${info}")"

            reviews="$(gh api --paginate --slurp \
              "repos/${repo}/pulls/${pr}/reviews?per_page=100")"
            # review-state-filter-begin
            if ! jq -e --arg head "${head}" '
              [flatten[] |
                select(
                  .author_association == "OWNER" or
                  .author_association == "MEMBER" or
                  .author_association == "COLLABORATOR"
                )] as $trusted |
              ($trusted | map(select(.commit_id == $head))) as $current |
              ($trusted |
              sort_by(.submitted_at, .id) |
              reduce .[] as $review ({};
                if $review.state == "COMMENTED" then
                  .[$review.user.login] //= "COMMENTED"
                elif $review.state == "DISMISSED" then
                  del(.[$review.user.login])
                else
                  .[$review.user.login] = $review.state
                end
              )) as $states |
              ($states | length > 0 and all(.[]; . == "APPROVED" or . == "COMMENTED")) and
              any($current[];
                .state == "APPROVED" or
                (.state == "COMMENTED" and
                  (.body // "" | startswith("**Actionable comments posted: ")) and
                  (.body // "" | contains("<!-- Review source: Codex CLI fallback; canonical visible structure:"))))
            ' <<<"${reviews}" >/dev/null; then
              echo "PR #${pr}: no trusted review on the current head, or an active change request is open; skipping."
              continue
            fi
            # review-state-filter-end

            # shellcheck disable=SC2016
            threads="$(gh api graphql -f owner="${owner}" -f name="${name}" -F number="${pr}" -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      nodes { isResolved }
                      pageInfo { hasNextPage }
                    }
                  }
                }
              }
            ')"
            if ! jq -e '
              .data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false and
              all(.data.repository.pullRequest.reviewThreads.nodes[]; .isResolved)
            ' <<<"${threads}" >/dev/null; then
              echo "PR #${pr}: unresolved review threads remain; skipping."
              continue
            fi

            checks="$(gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "repos/${repo}/commits/${head}/check-runs?per_page=100")"
            statuses="$(gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "repos/${repo}/commits/${head}/statuses?per_page=100")"
            contexts_ok=true
            while IFS= read -r required_check; do
              # required-context-filter-begin
              if ! jq -e --argjson required_check "${required_check}" --argjson statuses "${statuses}" '
                ($statuses | flatten) as $status_records |
                ([.[].check_runs[] |
                  select(.name == $required_check.context) |
                  select($required_check.integration_id == null or .app.id == $required_check.integration_id)] |
                  sort_by(.started_at, .id) |
                  last |
                  .conclusion == "success") or
                ($required_check.integration_id == null and
                  ([$status_records[] | select(.context == $required_check.context)] |
                    sort_by((.updated_at // .created_at // ""), .id) |
                    last |
                    .state == "success"))
              ' <<<"${checks}" >/dev/null; then
                contexts_ok=false
                echo "PR #${pr}: a required context is not successful; skipping."
                break
              fi
              # required-context-filter-end
            done < <(jq -c '.[]' <<<"${required}")
            [[ "${contexts_ok}" == true ]] || continue

            # merge-state-dispatch-begin
            case "${merge_state}" in
              CLEAN | HAS_HOOKS | UNSTABLE)
                # UNSTABLE은 "mergeable하지만 필수가 아닌 check가 green이 아님"이다.
                # required context는 위에서 ruleset 기준으로 이미 검증했으므로, ruleset이
                # 필수로 두지 않은 check로 병합을 막지 않는다.
                gh pr merge --squash --auto "${pr}" --repo "${repo}" \
                  --match-head-commit "${head}"
                echo "PR #${pr}: merge scheduled (${merge_state})."
                exit 0
                ;;
              BEHIND)
                if [[ "${head_repo}" != "${repo}" ]]; then
                  echo "::warning::PR #${pr} uses a fork head; refusing base-repository CI dispatch."
                  continue
                fi
                gh api --method PUT "repos/${repo}/pulls/${pr}/update-branch" \
                  -f expected_head_sha="${head}" >/dev/null
                # ponytail: bounded wait only; the API applies the base merge asynchronously.
                for _ in {1..12}; do
                  new_head="$(gh pr view "${pr}" --repo "${repo}" --json headRefOid --jq '.headRefOid')"
                  [[ "${new_head}" != "${head}" ]] && break
                  sleep 5
                done
                if [[ "${new_head}" == "${head}" ]]; then
                  # update-branch는 비동기라 bounded wait 안에 head가 안 바뀔 수 있다. stale
                  # ref로 CI를 쏘지 않고 다음 트리거에서 재시도한다. bare `[[ ]]`로 두면 bash
                  # 5에서는 아무 메시지 없이 job이 죽고 bash 3.2에서는 그냥 통과한다.
                  echo "PR #${pr}: base update has not landed yet; retrying on the next trigger."
                  exit 0
                fi
                gh workflow run ci.yml --repo "${repo}" --ref "${head_ref}"
                echo "PR #${pr}: base updated; CI dispatched."
                exit 0
                ;;
              DIRTY)
                # 충돌은 소유 세션이 rebase 해야 풀린다. GitHub이 PR에 충돌을 직접 표시하므로
                # 실행을 실패시키지 않고 경고만 남긴 뒤 다음 후보로 넘어간다.
                echo "::warning::PR #${pr} conflicts with the base branch; skipping until it is rebased."
                continue
                ;;
              BLOCKED | UNKNOWN)
                # UNKNOWN은 GitHub이 mergeability를 계산 중인 상태다. BLOCKED은 이 job이
                # 검사하지 않는 네이티브 규칙(추가 승인 수·code owner 리뷰·필수 배포 승인)이
                # 남아 있다는 뜻일 수 있다. 어느 쪽이든 이번 실행에서 할 수 있는 일이 없다.
                # 이 후보가 뒤를 막지 않으므로 지속 여부를 타이머로 판정할 필요가 없다.
                echo "PR #${pr}: not mergeable yet (${merge_state}); skipping."
                continue
                ;;
              *)
                # DRAFT는 위 검증에서 이미 걸러진다. 그 밖의 값은 GitHub이 enum을 늘렸다는
                # 뜻이라 사람이 봐야 하지만, 실행을 실패시키면 큐 전체가 멈추므로 경고만 남긴다.
                echo "::warning::PR #${pr} has an unrecognized merge state (${merge_state}); skipping."
                continue
                ;;
            esac
            # merge-state-dispatch-end
          done < <(jq -r '.[0:20][]' <<<"${candidates}")

          echo "No pull request in the automerge queue is ready to merge."
          # queue-loop-end
