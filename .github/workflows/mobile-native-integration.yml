name: Mobile Native Integration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile-native-integration.yml"
      - "apps/mobile/android/**"
      - "apps/mobile/ios/**"
      - "apps/mobile/integration_test/native_test.dart"
      - "apps/mobile/integration_test/core_screen_a11y_smoke_test.dart"
      - "apps/mobile/integration_test/native_smoke_test.dart"
      - "apps/mobile/integration_test/system_text_scale.dart"
      - "apps/mobile/test/support/core_screen_sweep_*.dart"
      - "apps/mobile/test/support/full_tap_target_guideline.dart"
      - "apps/mobile/lib/accessible_design.dart"
      - "apps/mobile/lib/search_field.dart"
      - "apps/mobile/lib/app/**"
      - "apps/mobile/lib/core/ui/**"
      - "apps/mobile/lib/features/facility_report/**"
      - "apps/mobile/lib/features/favorites/**"
      - "apps/mobile/lib/features/network_map/**"
      - "apps/mobile/lib/features/notifications/**"
      - "apps/mobile/lib/features/service_notice/**"
      - "apps/mobile/lib/features/settings/**"
      - "apps/mobile/lib/features/stations/**"
      - "tools/ci/android-native-drive.sh"
      - "tools/ci/ios-native-drive.sh"
      - "tools/ci/native-drive-common.sh"
      - "apps/mobile/lib/features/journey/**"
      - "apps/mobile/lib/features/route_draft/**"
      - "apps/mobile/lib/features/routes/**"
      - "apps/mobile/lib/generated/journey_v3/**"
      - "apps/mobile/pubspec.yaml"
      - "apps/mobile/pubspec.lock"
      - "tools/ci/mobile-native-integration-workflow.test.mjs"
      - "tools/ci/fixtures/android-drive/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-native-integration.yml"
      - "apps/mobile/android/**"
      - "apps/mobile/ios/**"
      - "apps/mobile/integration_test/native_test.dart"
      - "apps/mobile/integration_test/core_screen_a11y_smoke_test.dart"
      - "apps/mobile/integration_test/native_smoke_test.dart"
      - "apps/mobile/integration_test/system_text_scale.dart"
      - "apps/mobile/test/support/core_screen_sweep_*.dart"
      - "apps/mobile/test/support/full_tap_target_guideline.dart"
      - "apps/mobile/lib/accessible_design.dart"
      - "apps/mobile/lib/search_field.dart"
      - "apps/mobile/lib/app/**"
      - "apps/mobile/lib/core/ui/**"
      - "apps/mobile/lib/features/facility_report/**"
      - "apps/mobile/lib/features/favorites/**"
      - "apps/mobile/lib/features/network_map/**"
      - "apps/mobile/lib/features/notifications/**"
      - "apps/mobile/lib/features/service_notice/**"
      - "apps/mobile/lib/features/settings/**"
      - "apps/mobile/lib/features/stations/**"
      - "tools/ci/android-native-drive.sh"
      - "tools/ci/ios-native-drive.sh"
      - "tools/ci/native-drive-common.sh"
      - "apps/mobile/lib/features/journey/**"
      - "apps/mobile/lib/features/route_draft/**"
      - "apps/mobile/lib/features/routes/**"
      - "apps/mobile/lib/generated/journey_v3/**"
      - "apps/mobile/pubspec.yaml"
      - "apps/mobile/pubspec.lock"
      - "tools/ci/mobile-native-integration-workflow.test.mjs"
      - "tools/ci/fixtures/android-drive/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    name: Android Journey native smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NATIVE_TARGETS: native_test core_screen_a11y_smoke_test core_screen_a11y_smoke_test:2.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Verify native workflow contract
        run: node --test tools/ci/mobile-native-integration-workflow.test.mjs
      - name: Prepare Android native evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mobile-native-android"
          printf '%s\n' '{"schemaVersion":1,"lane":"android-native","status":"PENDING"}' > "${RUNNER_TEMP}/mobile-native-android/receipt.json"
          : > "${RUNNER_TEMP}/mobile-native-android/adb-crash.log"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Journey native smoke
        id: smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-port: 5554
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: apps/mobile
          script: bash ../../tools/ci/android-native-drive.sh
      - name: Record Android boot failure
        if: failure() && steps.smoke.conclusion == 'failure'
        shell: bash
        run: |
          receipt="${RUNNER_TEMP}/mobile-native-android/receipt.json"
          if grep -q '"status":"PENDING"' "${receipt}"; then
            printf '%s\n' '{"schemaVersion":1,"lane":"android-native","status":"FAIL","target":"emulator","step":"boot"}' > "${receipt}"
          fi
      - name: Upload Android native evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: mobile-native-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mobile-native-android/receipt.json
            ${{ runner.temp }}/mobile-native-android/flutter-drive-*.log
            ${{ runner.temp }}/mobile-native-android/adb-crash.log
          if-no-files-found: error
          retention-days: 5

  ios-native:
    name: iOS Journey native smoke
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      NATIVE_TARGETS: native_test core_screen_a11y_smoke_test core_screen_a11y_smoke_test:3.12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Prepare iOS native evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mobile-native-ios"
          printf '%s\n' '{"schemaVersion":1,"lane":"ios-native","status":"PENDING"}' > "${RUNNER_TEMP}/mobile-native-ios/receipt.json"
          : > "${RUNNER_TEMP}/mobile-native-ios/simulator.log"
      - name: Run iOS simulator native smoke
        id: smoke
        working-directory: apps/mobile
        run: bash ../../tools/ci/ios-native-drive.sh
      - name: Record iOS script failure
        if: failure() && steps.smoke.conclusion == 'failure'
        shell: bash
        run: |
          receipt="${RUNNER_TEMP}/mobile-native-ios/receipt.json"
          if grep -q '"status":"PENDING"' "${receipt}"; then
            printf '%s\n' '{"schemaVersion":1,"lane":"ios-native","status":"FAIL","target":"simulator","step":"boot"}' > "${receipt}"
          fi
      - name: Upload iOS native evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: mobile-native-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mobile-native-ios/receipt.json
            ${{ runner.temp }}/mobile-native-ios/flutter-drive-*.log
            ${{ runner.temp }}/mobile-native-ios/simulator.log
          if-no-files-found: error
          retention-days: 5
