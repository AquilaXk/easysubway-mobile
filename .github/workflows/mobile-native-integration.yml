name: Mobile Native Integration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile-native-integration.yml"
      - "apps/mobile/android/**"
      - "apps/mobile/ios/**"
      - "apps/mobile/integration_test/native_test.dart"
      - "apps/mobile/lib/features/journey/**"
      - "apps/mobile/lib/features/route_draft/**"
      - "apps/mobile/lib/generated/journey_v3/**"
      - "apps/mobile/pubspec.yaml"
      - "apps/mobile/pubspec.lock"
      - "tools/ci/mobile-native-integration-workflow.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-native-integration.yml"
      - "apps/mobile/android/**"
      - "apps/mobile/ios/**"
      - "apps/mobile/integration_test/native_test.dart"
      - "apps/mobile/lib/features/journey/**"
      - "apps/mobile/lib/features/route_draft/**"
      - "apps/mobile/lib/generated/journey_v3/**"
      - "apps/mobile/pubspec.yaml"
      - "apps/mobile/pubspec.lock"
      - "tools/ci/mobile-native-integration-workflow.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    name: Android Journey native smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Verify native workflow contract
        run: node --test tools/ci/mobile-native-integration-workflow.test.mjs
      - name: Prepare Android native evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mobile-native-android"
          printf '%s\n' '{"schemaVersion":1,"lane":"android-native","status":"PENDING"}' > "${RUNNER_TEMP}/mobile-native-android/receipt.json"
          : > "${RUNNER_TEMP}/mobile-native-android/flutter-test.jsonl"
          : > "${RUNNER_TEMP}/mobile-native-android/adb-crash.log"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Journey native smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-port: 5554
          disable-animations: true
          working-directory: apps/mobile
          script: |
            dart format --output=none --set-exit-if-changed integration_test/native_test.dart
            flutter analyze integration_test/native_test.dart
            if timeout 12m flutter test integration_test/native_test.dart -d emulator-5554 --file-reporter "json:${RUNNER_TEMP}/mobile-native-android/flutter-test.jsonl"; then printf '%s\n' '{"schemaVersion":1,"lane":"android-native","status":"PASS"}' > "${RUNNER_TEMP}/mobile-native-android/receipt.json"; else adb logcat -d -b crash > "${RUNNER_TEMP}/mobile-native-android/adb-crash.log" 2>&1 || true; printf '%s\n' '{"schemaVersion":1,"lane":"android-native","status":"FAIL"}' > "${RUNNER_TEMP}/mobile-native-android/receipt.json"; exit 1; fi
      - name: Upload Android native evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: mobile-native-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mobile-native-android/receipt.json
            ${{ runner.temp }}/mobile-native-android/flutter-test.jsonl
            ${{ runner.temp }}/mobile-native-android/adb-crash.log
          if-no-files-found: error
          retention-days: 5

  ios-compile:
    name: iOS simulator compile
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Prepare iOS compile evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mobile-native-ios"
          printf '%s\n' '{"schemaVersion":1,"lane":"ios-compile","status":"PENDING"}' > "${RUNNER_TEMP}/mobile-native-ios/receipt.json"
          : > "${RUNNER_TEMP}/mobile-native-ios/flutter-build-ios.log"
      - name: Compile iOS simulator debug app
        working-directory: apps/mobile
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          set -euo pipefail
          if flutter build ios --simulator --debug 2>&1 | tee "${RUNNER_TEMP}/mobile-native-ios/flutter-build-ios.log"; then
            printf '%s\n' '{"schemaVersion":1,"lane":"ios-compile","status":"PASS"}' > "${RUNNER_TEMP}/mobile-native-ios/receipt.json"
          else
            printf '%s\n' '{"schemaVersion":1,"lane":"ios-compile","status":"FAIL"}' > "${RUNNER_TEMP}/mobile-native-ios/receipt.json"
            exit 1
          fi
      - name: Upload iOS compile evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: mobile-native-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mobile-native-ios/receipt.json
            ${{ runner.temp }}/mobile-native-ios/flutter-build-ios.log
          if-no-files-found: error
          retention-days: 5
