name: Claude Code Review

# Claude Code 공식 /code-review(번들 skill)를 PR discovery 리뷰로 실행한다 (#406).
# target job이 리뷰 여부를 정하고 review job이 리뷰·게시·검증을 한다.
# - PR opened·ready_for_review·수동 재실행은 항상 리뷰한다.
# - synchronize·reopened는 PR commit 목록 안에 automerge 게이트가 인정할 claude[bot] Review가 이미 있으면
#   건너뛴다(change set당 discovery 1회). rebase로 리뷰한 commit이 목록에서 빠졌을 때만 다시 리뷰한다.
# - 같은 head의 다른 pull_request workflow가 모두 green이 된 뒤에만 리뷰한다(CI가 failing이면 AI 리뷰를 시작하지 않는다).
# 결과는 claude[bot] 신원의 단일 COMMENT Review(finding은 그 Review의 inline thread)로 게시된다.
# automerge-queue.yml review gate는 개수 줄, 리뷰 commit에서 이 workflow run의 success, 리뷰 commit 시점 PR diff에
# 이 workflow 변경 없음을 확인한 뒤에만 이 Review를 discovery로 인정한다.
# fork PR(시크릿 없음)과 봇이 실행 주체인 이벤트(action이 봇 actor를 거부)는 job if로 건너뛴다. skip은 게이트 통과가 아니다.
# 시크릿 누락·head 불일치·CI 미통과·action 실패·Review 미게시·검증 실패는 job 실패다.
# 수동 재실행은 PR head 브랜치 ref로 한다: gh workflow run claude-code-review.yml --ref <PR head 브랜치> -f pr_number=<N>

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: 리뷰할 PR 번호 (수동 재실행, PR head 브랜치 ref로 실행)
        required: true
        type: number

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  target:
    name: Claude Code Review 대상 확인
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.sender.type != 'Bot') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      should_review: ${{ steps.dedupe.outputs.should_review }}
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          state=$(jq -r '.state' <<<"${pr}")
          draft=$(jq -r '.draft' <<<"${pr}")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"${pr}")
          head_sha=$(jq -r '.head.sha' <<<"${pr}")
          head_ref=$(jq -r '.head.ref' <<<"${pr}")
          base_sha=$(jq -r '.base.sha' <<<"${pr}")
          if [ "${state}" != "open" ]; then
            echo "::error::PR #${PR_NUMBER}은 open 상태가 아니다(state=${state})."; exit 1
          fi
          if [ "${draft}" != "false" ]; then
            echo "::error::PR #${PR_NUMBER}은 Draft다. ready_for_review 뒤에 리뷰한다."; exit 1
          fi
          if [ "${head_repo}" != "${REPO}" ]; then
            echo "::error::PR #${PR_NUMBER}은 fork(${head_repo}) PR이다. 시크릿이 필요한 Claude 리뷰를 실행하지 않는다."; exit 1
          fi
          # 게이트는 리뷰 commit과 head_sha가 같은 이 workflow run의 success만 인정한다.
          # run head(pull_request=이벤트 head, workflow_dispatch=실행 ref)가 PR head와 다르면 게시할 Review가 인정될 수 없다.
          if [ "${head_sha}" != "${RUN_HEAD_SHA}" ]; then
            if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::PR #${PR_NUMBER} head(${head_sha})가 실행 ref head(${RUN_HEAD_SHA})와 다르다. PR head 브랜치 ref로 재실행한다: gh workflow run claude-code-review.yml --ref ${head_ref} -f pr_number=${PR_NUMBER}"
            else
              echo "::error::PR #${PR_NUMBER} head가 이 실행 뒤에 바뀌었다(실행 ${RUN_HEAD_SHA}, 현재 ${head_sha}). 새 head의 synchronize 실행이 리뷰한다."
            fi
            exit 1
          fi
          {
            echo "number=${PR_NUMBER}"
            echo "head_sha=${head_sha}"
            echo "head_ref=${head_ref}"
            echo "base_sha=${base_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check existing verified Claude review
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          # change set당 discovery 1회: synchronize·reopened는 PR commit 목록 안에 automerge 게이트가 인정할
          # claude[bot] Review(고정 신원·COMMENTED·개수 줄, 그 commit의 이 workflow run success,
          # 그 commit 시점 PR diff에 이 workflow 변경 없음)가 이미 있으면 리뷰하지 않는다.
          if [ "${EVENT_NAME}" != "pull_request" ] || { [ "${EVENT_ACTION}" != "synchronize" ] && [ "${EVENT_ACTION}" != "reopened" ]; }; then
            echo "should_review=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          reviews=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR_NUMBER}/reviews")
          commit_shas=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR_NUMBER}/commits" | jq -c '[flatten[] | .sha]')
          candidates=$(jq -c --argjson commit_shas "${commit_shas}" '
            [flatten[]
              | select(.user != null)
              | select(.author_association == "NONE" and
                  .user.login == "claude[bot]" and
                  .user.id == 209825114 and
                  .user.type == "Bot")
              | select(.state == "COMMENTED")
              | select((((.body // "") | split("\n")[0]) // "") | test("^🔴 [0-9]+ · 🟡 [0-9]+ · 🟣 [0-9]+$"))
              | .commit_id
              | select(. as $sha | any($commit_shas[]; . == $sha))]
            | unique
          ' <<<"${reviews}")
          reviewed_sha=""
          while IFS= read -r sha; do
            runs=$(gh api "repos/${REPO}/actions/workflows/claude-code-review.yml/runs?head_sha=${sha}&status=success&per_page=20")
            succeeded=$(jq -r --arg sha "${sha}" '
              if type == "object" and (.workflow_runs | type) == "array"
              then any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")
              else "unverifiable" end
            ' <<<"${runs}")
            if [ "${succeeded}" = "unverifiable" ]; then
              echo "::error::PR #${PR_NUMBER} commit ${sha}의 claude-code-review.yml run 목록을 해석할 수 없다. 리뷰 여부를 판정하지 않는다."
              exit 1
            fi
            if [ "${succeeded}" != "true" ]; then
              continue
            fi
            compare=$(gh api "repos/${REPO}/compare/${BASE_SHA}...${sha}?per_page=1")
            touched=$(jq -r '
              if type == "object" and (.files | type) == "array" and (.files | length) < 300 and
                all(.files[]; (.filename | type) == "string")
              then any(.files[]; .filename == ".github/workflows/claude-code-review.yml" or
                .previous_filename == ".github/workflows/claude-code-review.yml")
              else "unverifiable" end
            ' <<<"${compare}")
            if [ "${touched}" = "unverifiable" ]; then
              echo "::error::PR #${PR_NUMBER} commit ${sha}의 변경 파일 목록을 끝까지 확인할 수 없다(조회 형식 오류 또는 300개 상한). 리뷰 여부를 판정하지 않는다."
              exit 1
            fi
            if [ "${touched}" = "false" ]; then
              reviewed_sha="${sha}"
              break
            fi
          done < <(jq -r '.[]' <<<"${candidates}")
          if [ -n "${reviewed_sha}" ]; then
            echo "::notice::PR #${PR_NUMBER}은 commit ${reviewed_sha}에 검증된 claude[bot] discovery Review가 있다. change set당 1회 규약에 따라 다시 리뷰하지 않는다."
            echo "should_review=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_review=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Wait for CI on pull request head
        if: steps.dedupe.outputs.should_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          # deterministic gate(CI)가 failing이면 AI 리뷰를 시작하지 않는다.
          # 같은 head의 다른 pull_request workflow를 workflow_id별 최신 run(run_number 최대)으로만 판정한다.
          # concurrency로 대체된 이전 cancelled run은 무시하고, 최신 run이 success·skipped·neutral이 아니면 실패한다.
          # run이 하나도 보이지 않으면 최소 2분은 기다린다.
          started=$(date +%s)
          max_wait_seconds=1800
          while :; do
            elapsed=$(( $(date +%s) - started ))
            runs=$(gh api --paginate --slurp "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100")
            verdict=$(jq -c --argjson elapsed "${elapsed}" '
              [flatten[] | .workflow_runs[]
                | select(.event == "pull_request" and .path != ".github/workflows/claude-code-review.yml")]
              | group_by(.workflow_id)
              | map(max_by(.run_number)) as $latest
              | [$latest[] | select(.status == "completed" and
                  ((.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") | not))
                | "\(.name)(\(.conclusion))"] as $failed
              | if ($failed | length) > 0 then {state: "failed", failed: $failed}
                elif any($latest[]; .status != "completed") then {state: "wait"}
                elif ($latest | length) == 0 and $elapsed < 120 then {state: "wait"}
                else {state: "ready", runs: ($latest | length)} end
            ' <<<"${runs}")
            case "$(jq -r '.state' <<<"${verdict}")" in
              ready)
                echo "PR #${PR_NUMBER}: head ${HEAD_SHA}의 pull_request workflow $(jq -r '.runs' <<<"${verdict}")개가 모두 green이다."
                break
                ;;
              failed)
                echo "::error::PR #${PR_NUMBER} head ${HEAD_SHA}의 CI가 green이 아니다: $(jq -r '.failed | join(", ")' <<<"${verdict}"). CI green 후 재실행한다: gh workflow run claude-code-review.yml --ref ${HEAD_REF} -f pr_number=${PR_NUMBER}"
                exit 1
                ;;
              wait)
                if [ "${elapsed}" -ge "${max_wait_seconds}" ]; then
                  echo "::error::PR #${PR_NUMBER} head ${HEAD_SHA}의 CI가 ${max_wait_seconds}초 안에 끝나지 않았다. CI green 후 재실행한다: gh workflow run claude-code-review.yml --ref ${HEAD_REF} -f pr_number=${PR_NUMBER}"
                  exit 1
                fi
                sleep 30
                ;;
              *)
                echo "::error::CI 대기 판정을 해석할 수 없다: ${verdict}"
                exit 1
                ;;
            esac
          done

  review:
    name: Claude Code Review
    needs: target
    if: needs.target.outputs.should_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.target.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Restore base agent configuration
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # PR head가 추가·수정한 Claude Code 시작 설정을 모두 지우고 기본 브랜치에 있는 것만 되살린다.
          # 대상은 고정 action(v1.0.236) restore-config의 SENSITIVE_PATHS 8개(.claude, .mcp.json, .claude.json, .gitmodules,
          # .ripgreprc, CLAUDE.md, CLAUDE.local.md, .husky)이고, 하위 디렉터리의 같은 이름도 포함한다.
          # pull_request·workflow_dispatch 모든 경로에서 리뷰 설정은 base 기준이다.
          # PR의 .gitmodules가 fetch에 끼어들지 않도록 fetch 전에 지우고 submodule fetch도 끈다.
          listing=$(mktemp)
          find . -path ./.git -prune -o \( -name .claude -o -name .husky \) -prune -print0 -o \
            \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .mcp.json -o -name .claude.json \
              -o -name .gitmodules -o -name .ripgreprc \) -print0 > "${listing}"
          while IFS= read -r -d '' path; do
            rm -rf -- "${path}"
          done < "${listing}"
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "${DEFAULT_BRANCH}"
          git ls-tree -r -z --name-only FETCH_HEAD > "${listing}"
          while IFS= read -r -d '' path; do
            case "/${path}" in
              */CLAUDE.md | */CLAUDE.local.md | */.mcp.json | */.claude.json | */.gitmodules | */.ripgreprc | */.claude/* | */.husky/*)
                git checkout FETCH_HEAD -- "${path}"
                ;;
            esac
          done < "${listing}"
          rm -f -- "${listing}"

      - name: Record existing reviews
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.target.outputs.number }}
        run: |
          set -euo pipefail
          # 검증 step은 이 목록과의 차집합으로 이번 실행이 게시한 Review를 찾는다(시간 창을 쓰지 않는다).
          review_ids=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR_NUMBER}/reviews" | jq -c '[flatten[] | .id]')
          echo "review_ids=${review_ids}" >> "${GITHUB_OUTPUT}"

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /code-review high ${{ needs.target.outputs.number }}
          claude_args: |
            --allowedTools "Bash(gh pr view *),Bash(gh pr diff *),Edit(./claude-code-review.json),Bash(gh api --paginate repos/${{ github.repository }}/pulls/${{ needs.target.outputs.number }}/reviews),Bash(gh api repos/${{ github.repository }}/pulls/${{ needs.target.outputs.number }}/reviews --method POST --input claude-code-review.json)"
            --append-system-prompt 'EasySubway mobile PR discovery 리뷰 규칙 (Issue #406).
            리뷰 대상: ${{ github.repository }} PR ${{ needs.target.outputs.number }}, head commit ${{ needs.target.outputs.head_sha }}.
            작성자(사람, 에이전트, 자동화)나 변경 크기와 관계없이 이 PR을 반드시 리뷰하고 아래 게시 절차까지 마친다. 사소하거나 자동 생성된 PR이라는 이유로 건너뛰지 않는다.

            1. 언어: finding과 요약은 한국어로 쓴다. 식별자, 파일 경로, 명령어, 고정 토큰(API, CI, OAuth 등)은 영문 그대로 둔다.
            2. 심각도: 모든 finding 본문은 다음 중 하나로 시작한다. 🔴 Important(병합 전에 고칠 버그), 🟡 Nit(사소하지만 고칠 가치가 있음), 🟣 Pre-existing(이 PR이 만들지 않은 기존 버그).
            3. 저장소 우선순위: checkout에 CLAUDE.md가 없으므로 아래를 프로젝트 규칙으로 삼고 모든 리뷰 subagent에 그대로 전달한다.
               - Fallback 금지: 실패, 누락, 만료 데이터를 이전·로컬·레거시 결과, 추정치, placeholder로 덮어 성공처럼 표시하거나 stale 캐시를 최신 데이터처럼 표시하는 코드
               - 경로 탐색은 서버 공인 라우팅이다: 클라이언트 쪽 경로 계산이나 서버 우회 로직
               - 교통약자 접근성 회귀: 스크린리더 라벨 누락·중복·오독, 큰 글자(시스템 글자 크기 확대)에서 텍스트 잘림, 48dp 터치 타깃 미달
               - 버그 수정인데 수정 전에는 실패하는 테스트가 없음
               - CI와 릴리스 게이트 약화: warning-only 전환, continue-on-error, 검사 subset 또는 skip, 성공 fallback
               - contracts/documentation/documentation-fragment.json의 resources에 등록된 파일을 바꾸고 같은 PR에서 그 파일을 갱신하지 않음
               - 사용자 화면에 내부 거버넌스 문구(pilot, 검증, 게이트 등) 노출
               - 시크릿, API 키, 토큰, 내부 절대경로, 비공개 근거 데이터 노출
            4. 게시 절차(필수):
               - 리뷰가 끝나면 모든 finding을 GitHub PR Review 하나에 담는다. Write 도구로 현재 작업 디렉터리의 ./claude-code-review.json 파일에 다음 형태의 JSON을 쓴다.
                 {"commit_id": "${{ needs.target.outputs.head_sha }}", "event": "COMMENT", "body": "한국어 요약", "comments": [{"path": "파일 경로", "line": 123, "side": "RIGHT", "body": "finding"}]}
               - 그다음 정확히 이 명령 하나로 게시한다: gh api repos/${{ github.repository }}/pulls/${{ needs.target.outputs.number }}/reviews --method POST --input claude-code-review.json
               - 🔴 Important와 🟡 Nit finding은 반드시 comments의 inline 항목으로 넣고, 각 inline body는 그 심각도 이모지(🔴 또는 🟡)로 시작한다. line은 gh pr diff ${{ needs.target.outputs.number }}에서 새 파일(RIGHT) 쪽에 보이는 줄이어야 한다. diff 밖에 있는 🟣 Pre-existing finding만 body 목록에 쓸 수 있다.
               - body 첫 줄은 정확히 "🔴 <개수> · 🟡 <개수> · 🟣 <개수>" 형식의 심각도별 개수다. 검증 step과 automerge 게이트가 이 줄을 확인하고, 🔴·🟡 개수를 각각 그 이모지로 시작하는 inline 코멘트 수와 대조한다. 이어서 finding마다 한 줄 요약을 쓴다. finding이 없으면 comments는 빈 배열이고 body에 검토한 범위와 finding이 없다는 사실을 쓴다.
               - 게시 명령이 실패하면 다시 게시하기 전에 파이프 없이 정확히 이 명령으로 Review 목록을 읽는다: gh api --paginate repos/${{ github.repository }}/pulls/${{ needs.target.outputs.number }}/reviews
                 user.login이 claude[bot]이고 commit_id가 ${{ needs.target.outputs.head_sha }}이며 body가 ./claude-code-review.json의 body와 같은 Review가 이미 있으면 게시는 성공한 것이므로 다시 게시하지 않는다. 그런 Review가 없을 때만 오류를 읽고 JSON을 고쳐 게시 명령을 다시 실행한다. 성공한 뒤에는 다시 실행하지 않는다. 끝내 게시하지 못하면 게시했다고 말하지 말고 실패로 보고한다.
               - event는 항상 COMMENT다. APPROVE나 REQUEST_CHANGES를 쓰지 않고, 다른 댓글, 커밋, push, ./claude-code-review.json 밖의 파일 수정을 하지 않는다.'

      - name: Verify Claude review object
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.target.outputs.number }}
          HEAD_SHA: ${{ needs.target.outputs.head_sha }}
          BEFORE_REVIEW_IDS: ${{ steps.before.outputs.review_ids }}
        run: |
          set -euo pipefail
          reviews=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR_NUMBER}/reviews")
          # 이번 실행이 게시한 Review = 실행 전 목록에 없던 고정 신원 claude[bot] Review 중 본문 첫 줄이 개수 줄인 것.
          # 빈 본문(thread 답글 wrapper)은 개수 줄이 없어 빠진다. 필터는 한 번만 계산하고 판정과 대상 Review를 함께 낸다.
          selection=$(jq -c --argjson before "${BEFORE_REVIEW_IDS}" --arg head "${HEAD_SHA}" '
            [flatten[]
              | select(.user != null)
              | select(.author_association == "NONE" and
                  .user.login == "claude[bot]" and
                  .user.id == 209825114 and
                  .user.type == "Bot")
              | select(.id as $id | any($before[]; . == $id) | not)
              | select((((.body // "") | split("\n")[0]) // "") | test("^🔴 [0-9]+ · 🟡 [0-9]+ · 🟣 [0-9]+$"))] as $run_reviews
            | {ok: (($run_reviews | length) == 1 and ($run_reviews[0] | .state == "COMMENTED" and .commit_id == $head)),
               review: $run_reviews[0]}
          ' <<<"${reviews}")
          if [ "$(jq -r '.ok' <<<"${selection}")" != "true" ]; then
            echo "::error::이번 실행에서 head ${HEAD_SHA}에 대한 개수 줄이 있는 claude[bot] COMMENT Review가 정확히 하나 게시되지 않았다. automerge review gate가 인정할 discovery Review가 없다."
            exit 1
          fi
          review=$(jq -c '.review' <<<"${selection}")
          review_id=$(jq -r '.id' <<<"${review}")
          # 병합 차단은 미해결 inline thread에 의존한다. 🔴·🟡를 심각도별로 따로 세어 본문 개수와 대조한다(🟣 inline은 세지 않는다).
          inline=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${review_id}/comments" | jq -c '
            [flatten[] | (.body // "")] as $bodies
            | {red: ([$bodies[] | select(startswith("🔴"))] | length),
               nit: ([$bodies[] | select(startswith("🟡"))] | length)}
          ')
          coverage=$(jq -r --argjson inline "${inline}" '
            (((.body // "") | split("\n")[0]) // "") as $first
            | ([$first | capture("^🔴 (?<red>[0-9]+) · 🟡 (?<nit>[0-9]+) · 🟣 (?<pre>[0-9]+)$")] | first) as $counts
            | $counts != null and
              $inline.red >= ($counts.red | tonumber) and
              $inline.nit >= ($counts.nit | tonumber)
          ' <<<"${review}")
          if [ "${coverage}" != "true" ]; then
            echo "::error::claude[bot] Review 본문의 🔴·🟡 개수보다 해당 심각도 inline 코멘트(🔴 $(jq -r '.red' <<<"${inline}")건, 🟡 $(jq -r '.nit' <<<"${inline}")건)가 적거나 개수 줄이 없다. blocking finding이 thread 없이 병합될 수 있다."
            exit 1
          fi
          echo "PR #${PR_NUMBER}: claude[bot] COMMENT Review 1건 확인 (head ${HEAD_SHA}, inline 🔴 $(jq -r '.red' <<<"${inline}")건, 🟡 $(jq -r '.nit' <<<"${inline}")건)."
