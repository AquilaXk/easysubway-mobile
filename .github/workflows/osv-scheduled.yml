name: Scheduled Dependency Vulnerability Scan

on:
  schedule:
    - cron: "17 21 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  osv-scan:
    name: Scheduled OSV Scan
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9fd1bcce27f67e3bd819a0a7620e332803dc43bc
    with:
      export-results: false
      upload-sarif: true
      fail-on-vuln: true
      scan-args: |-
        --lockfile=apps/mobile/pubspec.lock
        --lockfile=apps/mobile/android/app/gradle.lockfile
