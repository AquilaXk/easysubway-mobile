name: Changed Path Classification Manual

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable base commit SHA
        required: true
        type: string
      head_sha:
        description: Immutable head commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  classify-changes-manual:
    name: Changed Path Classification Manual
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.classify.outputs['artifact-name'] }}
      classification-sha256: ${{ steps.classify.outputs['classification-sha256'] }}
      head-sha: ${{ steps.classify.outputs['head-sha'] }}
      outcome: ${{ steps.classify.outputs.outcome }}
      requires-full-host-tests: ${{ steps.classify.outputs['requires-full-host-tests'] }}
      requires-coverage: ${{ steps.classify.outputs['requires-coverage'] }}
      requires-android-build: ${{ steps.classify.outputs['requires-android-build'] }}
      requires-ios-compile: ${{ steps.classify.outputs['requires-ios-compile'] }}
      requires-native-integration: ${{ steps.classify.outputs['requires-native-integration'] }}
      requires-golden: ${{ steps.classify.outputs['requires-golden'] }}
      requires-contract-staging: ${{ steps.classify.outputs['requires-contract-staging'] }}
      requires-map-catalog-artifact-gate: ${{ steps.classify.outputs['requires-map-catalog-artifact-gate'] }}
      requires-architecture-gates: ${{ steps.classify.outputs['requires-architecture-gates'] }}
      requires-privacy-store-gate: ${{ steps.classify.outputs['requires-privacy-store-gate'] }}
      is-proven-docs-only: ${{ steps.classify.outputs['is-proven-docs-only'] }}
    steps:
      - name: Checkout trusted dispatch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify trusted dispatch identity
        env:
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
          MANUAL_HEAD_SHA: ${{ inputs.head_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "manual dispatch must use refs/heads/main" >&2
            exit 1
          fi
          if [[ "$MANUAL_HEAD_SHA" != "$GITHUB_SHA" ]]; then
            echo "manual head must equal trusted GitHub SHA" >&2
            exit 1
          fi
      - name: Run trusted manual classifier
        id: classify
        env:
          EVENT_REF: ${{ github.ref }}
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
          MANUAL_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          node tools/ci/mobile-changed-path-classifier.mjs run \
            --event workflow_dispatch \
            --base-sha "$MANUAL_BASE_SHA" \
            --head-sha "$MANUAL_HEAD_SHA" \
            --event-ref "$EVENT_REF" \
            --pull-request-number none
      - name: Append verified summary
        run: cat "$RUNNER_TEMP/mobile-changed-path-classification/mobile-changed-path-classification-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload classification artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ${{ steps.classify.outputs['artifact-name'] }}
          path: |
            ${{ runner.temp }}/mobile-changed-path-classification/mobile-changed-path-classification.json
            ${{ runner.temp }}/mobile-changed-path-classification/mobile-changed-path-classification-summary.md
            ${{ runner.temp }}/mobile-changed-path-classification/mobile-changed-path-classification.sha256
          if-no-files-found: error
